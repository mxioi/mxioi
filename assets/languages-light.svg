<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t">
<title id="t">Most used languages</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0969da" stop-opacity=".35"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></linearGradient>
</defs>
<style>
.h{font:700 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#1f2328}
.lbl{font:400 19px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#57606a}
.val{font:700 22px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#1f2328}
.fade{animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wipe{clip-path:inset(0 100% 0 0);animation:wipe 1.2s .2s cubic-bezier(.2,.7,.2,1) forwards}@keyframes wipe{to{clip-path:inset(0 0 0 0)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="999" height="249" rx="16" fill="url(#bg)" stroke="#d0d7de"/>
<rect x="28" y="28" width="5" height="26" rx="2.5" fill="url(#acc)"/>
<text x="46" y="50" class="h">Most used languages</text>
<clipPath id="bar"><rect x="30" y="82" width="940" height="16" rx="8"/></clipPath><rect x="30" y="82" width="940" height="16" rx="8" fill="#eaeef2"/><g clip-path="url(#bar)"><g class="wipe"><rect x="30.0" y="82" width="373.4" height="16" fill="#3572a5"/><rect x="403.4" y="82" width="205.4" height="16" fill="#012456"/><rect x="608.8" y="82" width="152.7" height="16" fill="#f1e05a"/><rect x="761.5" y="82" width="94.0" height="16" fill="#e34c26"/><rect x="855.5" y="82" width="69.9" height="16" fill="#663399"/><rect x="925.4" y="82" width="44.6" height="16" fill="#89e051"/></g></g><g class="fade" style="animation-delay:0.90s"><circle cx="38" cy="145" r="8" fill="#3572a5"/><text x="56" y="152" class="val" style="font-weight:600">Python</text><text x="326" y="152" class="lbl" text-anchor="end">39.5%</text><rect x="56" y="164" width="270" height="6" rx="3" fill="#eaeef2"/><rect x="56" y="164" width="106.7" height="6" rx="3" fill="#3572a5" class="grow" style="animation-delay:1.10s"/></g>
<g class="fade" style="animation-delay:1.00s"><circle cx="360" cy="145" r="8" fill="#012456"/><text x="378" y="152" class="val" style="font-weight:600">PowerShell</text><text x="648" y="152" class="lbl" text-anchor="end">21.7%</text><rect x="378" y="164" width="270" height="6" rx="3" fill="#eaeef2"/><rect x="378" y="164" width="58.7" height="6" rx="3" fill="#012456" class="grow" style="animation-delay:1.20s"/></g>
<g class="fade" style="animation-delay:1.10s"><circle cx="682" cy="145" r="8" fill="#f1e05a"/><text x="700" y="152" class="val" style="font-weight:600">JavaScript</text><text x="970" y="152" class="lbl" text-anchor="end">16.2%</text><rect x="700" y="164" width="270" height="6" rx="3" fill="#eaeef2"/><rect x="700" y="164" width="43.6" height="6" rx="3" fill="#f1e05a" class="grow" style="animation-delay:1.30s"/></g>
<g class="fade" style="animation-delay:1.20s"><circle cx="38" cy="205" r="8" fill="#e34c26"/><text x="56" y="212" class="val" style="font-weight:600">HTML</text><text x="326" y="212" class="lbl" text-anchor="end">9.9%</text><rect x="56" y="224" width="270" height="6" rx="3" fill="#eaeef2"/><rect x="56" y="224" width="26.8" height="6" rx="3" fill="#e34c26" class="grow" style="animation-delay:1.40s"/></g>
<g class="fade" style="animation-delay:1.30s"><circle cx="360" cy="205" r="8" fill="#663399"/><text x="378" y="212" class="val" style="font-weight:600">CSS</text><text x="648" y="212" class="lbl" text-anchor="end">7.4%</text><rect x="378" y="224" width="270" height="6" rx="3" fill="#eaeef2"/><rect x="378" y="224" width="20.0" height="6" rx="3" fill="#663399" class="grow" style="animation-delay:1.50s"/></g>
<g class="fade" style="animation-delay:1.40s"><circle cx="682" cy="205" r="8" fill="#89e051"/><text x="700" y="212" class="val" style="font-weight:600">Shell</text><text x="970" y="212" class="lbl" text-anchor="end">4.7%</text><rect x="700" y="224" width="270" height="6" rx="3" fill="#eaeef2"/><rect x="700" y="224" width="12.7" height="6" rx="3" fill="#89e051" class="grow" style="animation-delay:1.60s"/></g>
</svg>
