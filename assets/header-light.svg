<circle r="4.2" class="pkt"><animateMotion dur="2.6s" begin="0.45s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e1"/></animateMotion></circle>
<circle r="3.4" class="pkt2"><animateMotion dur="3.2s" begin="1.30s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e1"/></animateMotion></circle>
<circle r="4.2" class="pkt"><animateMotion dur="3.0s" begin="0.90s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e2"/></animateMotion></circle>
<circle r="3.4" class="pkt2"><animateMotion dur="3.6s" begin="1.60s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e2"/></animateMotion></circle>
<circle r="4.2" class="pkt"><animateMotion dur="2.2s" begin="1.35s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e3"/></animateMotion></circle>
<circle r="3.4" class="pkt2"><animateMotion dur="2.8000000000000003s" begin="1.90s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e3"/></animateMotion></circle>
<circle r="4.2" class="pkt"><animateMotion dur="2.6s" begin="1.80s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e4"/></animateMotion></circle>
<circle r="3.4" class="pkt2"><animateMotion dur="3.2s" begin="2.20s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e4"/></animateMotion></circle>
<g transform="translate(816 58)"><rect x="-48.0" y="-23.0" width="96" height="46" rx="20" class="node wan"/><text y="6" class="nl" text-anchor="middle">internet</text></g>
<g transform="translate(816 145)"><rect x="-48.0" y="-23.0" width="96" height="46" rx="8" class="node"/><circle cx="-37.0" cy="-7" r="4.5" class="led" style="animation-delay:0.4s"/><text x="-26.0" y="-2" class="nl">pfSense</text><text x="-26.0" y="15" class="ns">fw-01</text></g>
<g transform="translate(816 232)"><rect x="-48.0" y="-23.0" width="96" height="46" rx="8" class="node"/><circle cx="-37.0" cy="-7" r="4.5" class="led" style="animation-delay:0.8s"/><text x="-26.0" y="-2" class="nl">UniFi</text><text x="-26.0" y="15" class="ns">core-sw</text></g>
<g transform="translate(712 332)"><rect x="-48.0" y="-23.0" width="96" height="46" rx="8" class="node"/><circle cx="-37.0" cy="-7" r="4.5" class="led" style="animation-delay:1.2000000000000002s"/><text x="-26.0" y="-2" class="nl">AD DS</text><text x="-26.0" y="15" class="ns">dc-01</text></g>
<g transform="translate(816 332)"><rect x="-48.0" y="-23.0" width="96" height="46" rx="8" class="node"/><circle cx="-37.0" cy="-7" r="4.5" class="led" style="animation-delay:1.6s"/><text x="-26.0" y="-2" class="nl">Proxmox</text><text x="-26.0" y="15" class="ns">pve-01</text></g>
<g transform="translate(920 332)"><rect x="-48.0" y="-23.0" width="96" height="46" rx="8" class="node"/><circle cx="-37.0" cy="-7" r="4.5" class="led" style="animation-delay:2.0s"/><text x="-26.0" y="-2" class="nl">Docker</text><text x="-26.0" y="15" class="ns">k3s-01</text></g>
