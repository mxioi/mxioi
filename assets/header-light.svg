<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-labelledby="title desc">
<title id="title">Michael V</title>
<desc id="desc">Systems Administrator in the UK. Windows and Linux infrastructure, Active Directory, SCCM, Intune, networking and homelab automation.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d0d7de"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
<clipPath id="clip"><rect width="980" height="400" rx="18"/></clipPath>
<mask id="m"><rect width="980" height="400" fill="url(#fade)"/></mask>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono,.nl,.ns{font-family:ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace}
.name{font:700 118px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:url(#name)}
.role{font:500 38px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#1f2328}
.prompt{font:24px ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#57606a}
.rot{font-size:24px;fill:#1f2328;opacity:0}
.acc{fill:#0969da}
.cur{fill:#0969da;animation:blink 1s steps(1) infinite}
.edge{fill:none;stroke:#c8d1da;stroke-width:2}
.pkt{fill:#0969da}
.pkt2{fill:#8250df}
.node{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
.wan{stroke:#0969da;stroke-dasharray:4 4}
.nl{font-size:15px;font-weight:600;fill:#1f2328}
.ns{font-size:12.5px;fill:#57606a}
.led{fill:#1a7f37;animation:led 2.4s ease-in-out infinite}
.bar{fill:url(#name)}
@keyframes blink{50%{opacity:0}}
@keyframes led{0%,100%{opacity:1}50%{opacity:.35}}
.l0{animation:l0 14.0s infinite}
@keyframes l0{0%{opacity:0}0.00%{opacity:0}1.50%{opacity:1}23.50%{opacity:1}25.00%{opacity:0}100%{opacity:0}}
.l1{animation:l1 14.0s infinite}
@keyframes l1{0%{opacity:0}25.00%{opacity:0}26.50%{opacity:1}48.50%{opacity:1}50.00%{opacity:0}100%{opacity:0}}
.l2{animation:l2 14.0s infinite}
@keyframes l2{0%{opacity:0}50.00%{opacity:0}51.50%{opacity:1}73.50%{opacity:1}75.00%{opacity:0}100%{opacity:0}}
.l3{animation:l3 14.0s infinite}
@keyframes l3{0%{opacity:0}75.00%{opacity:0}76.50%{opacity:1}98.50%{opacity:1}100.00%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.l0{opacity:1}.pkt,.pkt2{display:none}}
</style>
<g clip-path="url(#clip)">
<rect width="980" height="400" fill="url(#bg)"/>
<rect width="980" height="400" fill="url(#dots)" mask="url(#m)"/>
<rect x="0" y="0" width="980" height="5" class="bar"/>
</g>
<text x="48" y="92" class="prompt"><tspan class="acc">michael@homelab</tspan>:~$ whoami</text>
<text x="42" y="206" class="name">Michael V</text>
<text x="48" y="268" class="role">Systems Administrator <tspan fill="#57606a">·</tspan> UK</text>
<text x="48" y="336" class="mono rot l0"><tspan class="acc">&gt;</tspan> Windows &amp; Linux infrastructure<tspan class="cur">▍</tspan></text>
<text x="48" y="336" class="mono rot l1"><tspan class="acc">&gt;</tspan> Active Directory · SCCM/MECM · Intune<tspan class="cur">▍</tspan></text>
<text x="48" y="336" class="mono rot l2"><tspan class="acc">&gt;</tspan> UniFi · pfSense · RADIUS/802.1X<tspan class="cur">▍</tspan></text>
<text x="48" y="336" class="mono rot l3"><tspan class="acc">&gt;</tspan> Proxmox · Docker · homelab automation<tspan class="cur">▍</tspan></text>
<g>
