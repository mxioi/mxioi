.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s .3s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}.area{opacity:0;animation:fade 1s 1.6s ease-out forwards}.dot{opacity:0;animation:pulse 2s 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
