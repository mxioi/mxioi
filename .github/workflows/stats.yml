name: Update stats

on:
  push:
    paths:
      - scripts/make_stats.py
      - .github/workflows/stats.yml
  schedule:
    - cron: "0 5 * * *"  # Daily, to keep stars, commits and languages current
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats and languages cards
        run: python scripts/make_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git add assets/stats-*.svg assets/languages-*.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stats cards"
          git push
