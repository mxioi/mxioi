# Projects shown on my GitHub profile.
#
# To change what's featured, edit this file and push. The "Update projects"
# workflow rebuilds the projects section of README.md automatically, pulling
# each repo's description, stars and language live from GitHub.
#
#   repo      = repository name under github.com/mxioi (required)
#   emoji     = icon shown before the title (optional)
#   title     = display name (optional, defaults to the repo name)
#   summary   = one line on what it is (optional, defaults to the repo description)
#   shows     = what it demonstrates to someone reading my profile (optional)
#   tech      = badges to show (optional)
#
# Private, deleted or renamed repos are skipped automatically, so the profile
# never shows a broken link.

